<style>
body { font-family: -apple-system, "Noto Sans Thai", sans-serif; margin: 0; overflow: hidden; }

/* ========== APP SHELL ========== */
.app { display: grid; grid-template-rows: 52px 1fr 30px; height: 100vh; background: #fff; }
.app-body { display: grid; overflow: hidden; }

/* Desktop */
@media (min-width: 1024px) {
  .app-body { grid-template-columns: 300px 1fr; }
  .sidebar { border-right: 1px solid #f0f0f0; }
  .detail-panel { background: #f8faf9; }
  .mobile-detail-wrap { display: none; }
}
/* Tablet */
@media (min-width: 768px) and (max-width: 1023px) {
  .app-body { grid-template-columns: 280px 1fr; }
  .sidebar { border-right: 1px solid #f0f0f0; }
  .detail-panel { background: #f8faf9; }
  .mobile-detail-wrap { display: none; }
}
/* Mobile */
@media (max-width: 767px) {
  .app-body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .detail-panel { display: none; }
  .mobile-detail-wrap { display: block; position: fixed; inset: 0; z-index: 40; background: #f8faf9; overflow-y: auto; }
  .mobile-detail-wrap.hidden { display: none; }
}

/* ========== SIDEBAR ========== */
.sidebar { display: flex; flex-direction: column; background: #fff; overflow: hidden; }
.sidebar-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #e5e7eb transparent; }
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

/* ========== TICKET ROW ========== */
.t-row {
  display: grid; grid-template-columns: auto 1fr auto;
  gap: 10px; align-items: center;
  padding: 10px 14px; cursor: pointer;
  border-left: 3px solid transparent;
  border-bottom: 1px solid #f5f5f5;
  transition: all 0.15s;
}
.t-row:hover { background: #f0fdf4; border-left-color: #34d399; }
.t-row.active { background: #ecfdf5; border-left-color: #059669; }
.t-row .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ========== VIEW TOGGLE ========== */
.view-toggle { display: inline-flex; gap: 2px; background: #f3f4f6; border-radius: 8px; padding: 2px; }
.view-btn {
  padding: 4px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; border: none; background: transparent; color: #6b7280;
  display: flex; align-items: center; gap: 5px;
}
.view-btn.active { background: #fff; color: #111827; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

/* ========== DETAIL ========== */
.detail-panel { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #e5e7eb transparent; }
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }
.info-box { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 14px 16px; }
.info-label { font-size: 11px; color: #9ca3af; margin-bottom: 2px; }
.info-val { font-size: 13px; color: #374151; font-weight: 500; }

/* ========== TIMELINE ========== */
.tl-step { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 10px; }
.tl-line { flex: 1; height: 2px; margin: 0 -2px; min-width: 16px; }

/* ========== STAT BADGE ========== */
.stat-badge { display: flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }

/* ========== ACTION BTN ========== */
.act-btn {
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; border: none; display: inline-flex;
  align-items: center; gap: 5px;
}
.act-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
.act-primary { background: #059669; color: white; }
.act-secondary { background: #fff; color: #374151; border: 1px solid #e5e7eb; }

/* ========== RECEIPT (50mm thermal) ========== */
.thermal-receipt {
  font-family: 'Courier New', 'Noto Sans Thai', monospace;
  width: 50mm; min-width: 50mm; max-width: 50mm;
  margin: 0 auto; background: #fff; color: #1a1a1a;
  font-size: 7pt; line-height: 1.4; padding: 0;
}
.receipt-cut-top, .receipt-cut-bottom {
  width: 50mm; height: 4mm;
  background: repeating-linear-gradient(135deg,#fff 0px,#fff 2px,#ddd 2px,#ddd 4px,#fff 4px,#fff 6px);
}
.receipt-cut-bottom { margin-top: 2mm; }
.receipt-content { padding: 2mm 3mm; }
.r-logo { font-size:16pt; line-height:1; margin-bottom:1mm; text-align:center; }
.r-org { font-size:9pt; font-weight:700; letter-spacing:3px; text-align:center; }
.r-sub { font-size:6pt; letter-spacing:2px; opacity:.7; text-align:center; }
.r-title { font-size:8pt; font-weight:700; margin:1.5mm 0; text-align:center; }
.r-div { border:none; border-top:1px dashed #999; margin:1.5mm 0; }
.r-num-row { display:flex; align-items:baseline; justify-content:center; gap:2mm; margin:1mm 0; }
.r-num-lbl { font-size:6pt; opacity:.6; }
.r-num-val { font-size:11pt; font-weight:900; font-family:'Courier New',monospace; }
.r-date { text-align:center; font-size:6.5pt; opacity:.7; }
.r-row { display:flex; justify-content:space-between; align-items:flex-start; margin:.5mm 0; gap:1mm; }
.r-lbl { font-size:6.5pt; opacity:.5; white-space:nowrap; flex-shrink:0; }
.r-val { font-size:6.5pt; font-weight:500; text-align:right; word-break:break-word; }
.r-val.bold { font-weight:700; }
.r-center { justify-content:center; }
.r-sect { font-size:6.5pt; font-weight:700; opacity:.5; letter-spacing:.5px; margin-bottom:.5mm; padding-bottom:.3mm; border-bottom:.5px solid #ccc; }
.r-desc { font-size:6.5pt; line-height:1.4; margin:.5mm 0; word-break:break-word; }
.r-danger { color:#dc3545; }
.r-sig-sec { display:flex; gap:2mm; margin:1mm 0; }
.r-sig-blk { flex:1; text-align:center; }
.r-sig-lbl { font-size:5.5pt; opacity:.5; margin-bottom:.5mm; }
.r-sig-wrap { border:.5px solid #ccc; height:8mm; display:flex; align-items:center; justify-content:center; padding:.5mm; background:#fafafa; }
.r-total-row { border-top:1px solid #333; padding-top:.5mm; margin-top:.5mm; }
.r-total-row .r-lbl { font-weight:700; opacity:1; }
.r-total-row .r-val { font-size:8pt; font-weight:900; }
.r-footer { text-align:center; margin-top:2mm; padding-top:1mm; }
.r-foot-line { font-size:5pt; opacity:.4; margin:.3mm 0; }
.r-foot-thanks { font-size:6pt; margin-top:1mm; opacity:.6; }
.s-pending { background:#fff3cd; color:#856404; }
.s-accepted { background:#d1ecf1; color:#0c5460; }
.s-in_progress { background:#e2d5f1; color:#4a1d8e; }
.s-returned { background:#d4edda; color:#155724; }
.s-closed { background:#e2e3e5; color:#383d41; }
.s-cancelled { background:#f8d7da; color:#721c24; }
.receipt-preview-wrap {
  background:#e8e8e8; padding:20px 24px; border-radius:12px;
  display:flex; justify-content:center; overflow-x:auto;
}
.receipt-preview-wrap .thermal-receipt {
  transform:scale(2.2); transform-origin:top center;
  box-shadow:2px 4px 16px rgba(0,0,0,.18); border-radius:2px;
}

/* ========== MODAL ========== */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:16px;
  backdrop-filter: blur(2px);
}
.modal-content {
  background:#fff; border-radius:12px; max-width:420px; width:100%;
  max-height:90vh; overflow-y:auto;
}

/* ========== PRINT ========== */
@media print {
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }
  .print-area { position:fixed; top:0; left:0; width:100%; background:#fff; z-index:99999; }
  .print-area .thermal-receipt { transform:none!important; box-shadow:none!important; }
  @page { size:50mm auto; margin:0; }
}
@media (max-width:640px) {
  .receipt-preview-wrap .thermal-receipt { transform:scale(1.8); }
}
</style>
</head>

  accepted:   { label:'รับเรื่องแล้ว', short:'รับ',   dot:'#3b82f6', bg:'bg-blue-50',    text:'text-blue-600' },
  in_progress:{ label:'กำลังซ่อม',   short:'ซ่อม',  dot:'#8b5cf6', bg:'bg-violet-50',  text:'text-violet-600' },

  photo_demo_1: { label:'จอมีจุดสีแดงกระจาย', color:'#fee2e2' },
  photo_demo_2: { label:'จอดับขณะใช้งาน', color:'#fef3c7' },
};

// ===================== STATE =====================
let state = { view: 'customer', selectedId: null };
const isMobile = () => window.innerWidth < 768;

// ===================== RENDER =====================
function render() {
  renderToggle();
  renderStats();
  renderList();
  renderDetail();
}

// -- Toggle --
function renderToggle() {
  document.querySelectorAll('.view-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
  // Show/hide create button (customer only)
  document.getElementById('btn-create').style.display = state.view === 'customer' ? '' : 'none';
}

// -- Stats --
function renderStats() {
  const counts = {};
  Object.keys(statusCfg).forEach(k => counts[k] = 0);
  tickets.forEach(t => counts[t.status]++);
  const total = tickets.length;
  const area = document.getElementById('stats-area');

  if (state.view === 'customer') {
    area.innerHTML = `
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs text-gray-400">งานของคุณ</span>
        <span class="text-sm font-bold text-gray-700">${total}</span>
        <span class="text-xs text-gray-300">รายการ</span>
        <div class="ml-auto flex gap-1">
          ${Object.entries(statusCfg).map(([k,v]) => counts[k] > 0 ? `
            <span class="inline-flex items-center gap-1 text-[10px] ${v.text} bg-white px-1.5 py-0.5 rounded border border-gray-100">
              <span class="w-1.5 h-1.5 rounded-full" style="background:${v.dot}"></span>${counts[k]}
            </span>` : '').join('')}
        </div>
      </div>`;
  } else {
    area.innerHTML = `
      <div class="flex items-center gap-2 flex-wrap">
        <span class="stat-badge bg-gray-50 text-gray-600">
          <span class="font-bold">${total}</span> ทั้งหมด
        </span>
        ${Object.entries(statusCfg).map(([k,v]) => counts[k] > 0 ? `
          <span class="stat-badge ${v.bg} ${v.text}">
            <span class="w-1.5 h-1.5 rounded-full" style="background:${v.dot}"></span>
            <span class="font-bold">${counts[k]}</span> ${v.short}
          </span>` : '').join('')}
      </div>`;
  }
}

// -- Ticket List --
function renderList() {
  const query = (document.getElementById('search-input')?.value || '').toLowerCase();
  const filtered = query ? tickets.filter(t =>
    t.ticketNo.toLowerCase().includes(query) ||
    t.assetName.toLowerCase().includes(query) ||
    t.reporterName?.toLowerCase().includes(query)
  ) : tickets;

  const el = document.getElementById('list-area');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="text-center py-8 text-gray-300 text-xs">ไม่พบรายการ</div>';
    return;
  }

  el.innerHTML = filtered.map(t => {
    const s = statusCfg[t.status];
    const active = t.id === state.selectedId;
    return `
      <div class="t-row ${active ? 'active' : ''}" onclick="selectTicket('${t.id}')">
        <div class="dot" style="background:${s.dot}"></div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-gray-700 font-mono">${t.ticketNo}</span>
            <span class="text-[10px] ${s.text} ${s.bg} px-1.5 py-0.5 rounded font-medium">${s.short}</span>
          </div>
          <p class="text-xs text-gray-500 truncate mt-0.5">${t.assetName}</p>
        </div>
        <span class="text-[10px] text-gray-300 whitespace-nowrap">${t.createdAt.split(' ')[0]}</span>
      </div>`;
  }).join('');
}

// -- Detail --
function renderDetail() {
  const html = state.selectedId ? buildDetailHTML(state.selectedId) : buildEmptyHTML();

  // Desktop/tablet
  document.getElementById('detail-content').innerHTML = html;

  // Mobile
  const mWrap = document.getElementById('mobile-detail');
  const mContent = document.getElementById('mobile-detail-content');
  if (isMobile() && state.selectedId) {
    mContent.innerHTML = html;
    mWrap.classList.remove('hidden');
  } else {
    mWrap.classList.add('hidden');
  }
}

function buildEmptyHTML() {
  if (state.view === 'customer') {
    return `
      <div class="flex flex-col items-center justify-center h-full min-h-[400px] text-center">
        <div class="text-4xl mb-4">📋</div>
        <p class="text-sm text-gray-400">เลือกรายการแจ้งซ่อมเพื่อติดตามสถานะ</p>
      </div>`;
  }
  return `
    <div class="flex flex-col items-center justify-center h-full min-h-[400px] text-center">
      <div class="text-4xl mb-4">📊</div>
      <p class="text-sm text-gray-400">เลือกรายการเพื่อดูรายละเอียดและจัดการ</p>
    </div>`;
}

function buildDetailHTML(id) {
  const t = tickets.find(x => x.id === id);
  if (!t) return '';
  const s = statusCfg[t.status];
  const isAdmin = state.view === 'admin';
  const timeline = ['pending','accepted','in_progress','returned','closed'];
  const idx = (t.status === 'cancelled' || t.status === 'disposed') ? -1 : timeline.indexOf(t.status);

  let html = '';

  // -- Header row --
  html += `
    <div class="flex items-center justify-between mb-5">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-lg font-bold text-gray-900 font-mono">${t.ticketNo}</span>
          <span class="inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full ${s.bg} ${s.text}">
            <span class="w-1.5 h-1.5 rounded-full" style="background:${s.dot}"></span>
            ${s.label}
          </span>
        </div>
        <p class="text-xs text-gray-400 mt-1">${t.createdAt}</p>
      </div>
      <div class="flex items-center gap-2" id="detail-actions-top">
        ${isAdmin ? '' : ''}
        ${t.receivedBy ? `
          <button onclick="openReceipt('${t.id}','repair')" class="act-btn act-secondary text-xs" title="ปริ้นใบรับซ่อม">🖨️ ใบรับ</button>` : ''}
        ${t.returnedBy ? `
          <button onclick="openReceipt('${t.id}','return')" class="act-btn act-secondary text-xs" title="ปริ้นใบส่งคืน">🖨️ ใบส่งคืน</button>` : ''}
      </div>
    </div>`;

  // -- Cancel reason --
  if (t.cancelReason) {
    html += `
      <div class="bg-red-50 border border-red-100 rounded-lg p-3 mb-4">
        <p class="text-[11px] font-semibold text-red-500 mb-1">เหตุผลการยกเลิก</p>
        <p class="text-xs text-red-400 leading-relaxed">${t.cancelReason}</p>
      </div>`;
  }

  // -- Info grid: 3 columns on desktop, 2 on tablet, 1 on mobile --
  const hasCost = t.totalCost != null;
  const hasReturn = t.returnedBy != null;
  const colsClass = hasCost ? 'grid-cols-1 md:grid-cols-3' : 'grid-cols-1 md:grid-cols-2';

  html += `<div class="grid ${colsClass} gap-3 mb-4">`;

  // Col 1: Equipment
  html += `
    <div class="info-box">
      <h4 class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">🖥️ อุปกรณ์</h4>
      <div class="space-y-1.5">
        <div><div class="info-label">ชื่อ</div><div class="info-val">${t.assetName}</div></div>
        <div><div class="info-label">ครุภัณฑ์</div><div class="info-val font-mono text-xs">${t.assetCode}</div></div>
        <div><div class="info-label">ประเภท</div><div class="info-val">${t.category}</div></div>
        <div><div class="info-label">สถานที่</div><div class="info-val">${t.location}</div></div>
      </div>
    </div>`;

  // Col 2: Problem + Reporter
  html += `
    <div class="info-box">
      <h4 class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">📋 รายละเอียด</h4>
      <div class="space-y-1.5">
        <div><div class="info-label">ปัญหา</div><div class="info-val text-xs leading-relaxed">${t.problemDetails}</div></div>
        <div><div class="info-label">ผู้แจ้ง</div><div class="info-val">${t.reporterName}</div></div>
        ${t.receivedBy ? `
        <div><div class="info-label">ผู้รับเรื่อง</div><div class="info-val">${t.receivedBy}</div></div>
        <div><div class="info-label">รับเมื่อ</div><div class="info-val">${t.receivedAt}</div></div>` : ''}
      </div>
    </div>`;

  // Col 3: Cost (if applicable)
  if (hasCost) {
    html += `
      <div class="info-box">
        <h4 class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">💰 ค่าใช้จ่าย</h4>
        <div class="space-y-1.5">
          <div class="flex justify-between"><span class="info-label">ค่าอะไหล่</span><span class="info-val">${t.repairCost.toLocaleString()} ฿</span></div>
          <div class="flex justify-between"><span class="info-label">ค่าแรง</span><span class="info-val">${t.laborCost.toLocaleString()} ฿</span></div>
          <div class="border-t border-dashed border-gray-200 pt-1.5 mt-1.5 flex justify-between items-baseline">
            <span class="text-xs font-semibold text-gray-500">รวม</span>
            <span class="text-base font-bold text-emerald-600">${t.totalCost.toLocaleString()} <span class="text-xs font-normal text-gray-400">฿</span></span>
          </div>
          <div class="text-[10px] text-gray-400 mt-1">
            สถานะ: ${t.costStatus === 'approved' ? '✅ อนุมัติแล้ว' : t.costStatus === 'paid' ? '💰 ชำระแล้ว' : '-'}
          </div>
        </div>
      </div>`;
  }

  html += `</div>`; // end grid

  // -- Return info (compact strip) --
  if (hasReturn) {
    html += `

        <span class="text-xs text-gray-500">โดย ${t.returnedBy}</span>
        <span class="text-xs text-gray-400">${t.returnedAt}</span>
      </div>`;
  }

  // -- Signatures (compact, inline) --
  if (t.receivedBy && isAdmin) {
    html += `
      <div class="info-box mb-4">
        <h4 class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">✍️ ลายเซ็น</h4>
        <div class="grid grid-cols-2 gap-3">
          <div class="border border-gray-100 rounded-md p-2 text-center bg-gray-50/30">

        </div>
      </div>`;

  if (t.returnedBy && isAdmin) {

        <div class="grid grid-cols-2 gap-3">
          <div class="border border-gray-100 rounded-md p-2 text-center bg-gray-50/30">
            <p class="text-[9px] text-gray-400 mb-1">ผู้ส่งคืน</p>
            <svg viewBox="0 0 100 30" class="w-full h-8"><path d="M5 20Q15 5 25 18Q30 10 40 22Q50 5 60 20Q70 10 80 18Q85 25 95 8" stroke="#bbb" stroke-width="1.2" fill="none"/></svg>
          </div>
          <div class="border border-gray-100 rounded-md p-2 text-center bg-gray-50/30">
            <p class="text-[9px] text-gray-400 mb-1">ผู้รับคืน</p>
            <svg viewBox="0 0 100 30" class="w-full h-8"><path d="M10 18Q20 8 30 22Q35 12 45 20Q55 5 65 18Q75 10 85 22Q90 15 95 20" stroke="#bbb" stroke-width="1.2" fill="none"/></svg>
          </div>
        </div>
      </div>`;
  }

  // -- Timeline --
  if (t.status !== 'cancelled' && t.status !== 'disposed') {
    html += `
      <div class="info-box mb-4">
        <div class="flex items-center gap-0">
          ${timeline.map((st, i) => {
            const sc = statusCfg[st];
            const done = i <= idx;
            const current = i === idx;
            const isLast = i === timeline.length - 1;
            return `
              <div class="flex items-center ${isLast ? '' : 'flex-1'}">
                <div class="tl-step">
                  <div class="tl-dot ${current ? 'bg-emerald-600 text-white ring-[3px] ring-emerald-100' : done ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-300'}">
                    ${done ? '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : '<div class="w-1.5 h-1.5 rounded-full bg-gray-300"></div>'}

      <button onclick="showToast('✅ รับเรื่องเรียบร้อย')" class="act-btn act-primary">✅ รับเรื่อง</button>
      <button onclick="showToast('❌ ยกเลิกแล้ว')" class="act-btn act-secondary text-red-500 border-red-200 hover:bg-red-50">❌ ยกเลิก</button>
      <button onclick="openDisposalModal('${t.id}')" class="act-btn act-secondary text-orange-600 border-orange-200 hover:bg-orange-50">🗑️ ตีแทงจำหน่าย</button>`;
    if (t.status === 'accepted') actions = `
      <button onclick="showToast('🔧 เริ่มซ่อมแล้ว')" class="act-btn act-primary" style="background:#7c3aed">🔧 เริ่มซ่อม</button>
      <button onclick="openReceipt('${t.id}','repair')" class="act-btn act-secondary">🖨️ ปริ้นรับซ่อม</button>`;
    if (t.status === 'in_progress') actions = `
      <button onclick="showToast('💰 เสนอราคาเรียบร้อย')" class="act-btn act-primary" style="background:#d97706">💰 เสนอราคา</button>
      <button onclick="showToast('📦 ส่งคืนเรียบร้อย')" class="act-btn act-primary">📦 ส่งคืน</button>
      <button onclick="openDisposalModal('${t.id}')" class="act-btn act-secondary text-orange-600 border-orange-200 hover:bg-orange-50">🗑️ ซ่อมไม่ได้ — ตีแทง</button>`;
    if (t.status === 'returned') actions = `
      <button onclick="showToast('✅ ปิดงานเรียบร้อย')" class="act-btn act-primary" style="background:#374151">✅ ปิดงาน</button>
      <button onclick="openReceipt('${t.id}','return')" class="act-btn act-secondary">🖨️ ปริ้นส่งคืน</button>`;

    if (actions) {
      html += `
        <div class="info-box flex flex-wrap items-center gap-2">
          <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mr-2">ดำเนินการ</span>
          ${actions}
        </div>`;
    }
  }

  // -- Photos --
  if (t.photos && t.photos.length > 0) {
    html += `
      <div class="info-box mb-4">
        <h4 class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">📷 รูปประกอบ (${t.photos.length} รูป)</h4>
        <div class="flex gap-2 flex-wrap">
          ${t.photos.map((p, i) => {
            const ph = photoPlaceholders[p];
            if (ph) {
              return `<div class="w-16 h-16 rounded-md border border-gray-200 flex items-center justify-center text-xs text-gray-400 relative overflow-hidden cursor-pointer hover:opacity-80 transition" onclick="showToast('📸 ${ph.label}')" title="${ph.label}">
                <div class="absolute inset-0" style="background:${ph.color}"></div>
                <span class="relative">📷</span>
              </div>`;
            }
            return `<div class="w-16 h-16 rounded-md border border-gray-200 flex items-center justify-center text-xs text-gray-400 bg-gray-50 cursor-pointer hover:opacity-80 transition" onclick="showLightbox('${p}')">
              <img src="${p}" class="w-full h-full object-cover rounded-md" alt="รูปที่ ${i+1}">
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  // -- Disposal Info --
  if (t.disposalStatus) {
    const dc = disposalCfg[t.disposalStatus];
    html += `
      <div class="info-box mb-4 border-orange-200 bg-orange-50/50">
        <h4 class="text-[10px] font-semibold text-orange-500 uppercase tracking-wider mb-2">🗑️ ตีแทงจำหน่ายครุภัณฑ์</h4>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
          <div><span class="text-gray-400 block text-[10px]">สถานะ</span><span class="font-medium ${dc?.text || 'text-gray-600'}">${dc?.label || t.disposalStatus}</span></div>
          ${t.disposalReason ? `<div class="col-span-2 md:col-span-3"><span class="text-gray-400 block text-[10px]">เหตุผล</span><span class="text-gray-700">${t.disposalReason}</span></div>` : ''}
          ${t.disposalMethod ? `<div><span class="text-gray-400 block text-[10px]">วิธีจำหน่าย</span><span class="text-gray-700">${t.disposalMethod}</span></div>` : ''}
          ${t.disposalValue != null ? `<div><span class="text-gray-400 block text-[10px]">ราคาประเมิน</span><span class="font-semibold text-gray-800">${t.disposalValue.toLocaleString()} ฿</span></div>` : ''}
          ${t.disposalApprovedBy ? `<div><span class="text-gray-400 block text-[10px]">ผู้อนุมัติ</span><span class="text-gray-700">${t.disposalApprovedBy}</span></div>` : ''}
          ${t.disposalComRef ? `<div><span class="text-gray-400 block text-[10px]">หนังสือ</span><span class="text-gray-700 font-mono">${t.disposalComRef}</span></div>` : ''}
        </div>
      </div>`;
  }

  // -- Customer: status message --
  if (!isAdmin) {
    let msg = '';
    if (t.status === 'pending') msg = '📄 รอเจ้าหน้าที่รับเรื่อง กรุณารอสักครู่';
    if (t.status === 'accepted') msg = '🔍 เจ้าหน้าที่รับเรื่องแล้ว กำลังดำเนินการต่อ';
    if (t.status === 'in_progress') msg = '🔧 กำลังซ่อมอุปกรณ์ของคุณอยู่';
    if (t.status === 'returned') msg = '✅ ซ่อมเสร็จแล้ว กรุณารับอุปกรณ์คืน';
    if (t.status === 'closed') msg = '🎉 ดำเนินการเสร็จสิ้นแล้ว';
    if (t.status === 'cancelled') msg = '❌ รายการนี้ถูกยกเลิก';
    if (t.status === 'disposed') msg = '🗑️ ครุภัณฑ์ซ่อมไม่ได้ กำลังดำเนินการตีแทงจำหน่าย';
    if (msg) {
      html += `
        <div class="info-box ${t.status === 'cancelled' ? 'bg-red-50 border-red-100' : 'bg-emerald-50 border-emerald-100'}">
          <p class="text-xs text-gray-600">${msg}</p>
        </div>`;
    }
  }

  return html;
}

// ===================== RECEIPT =====================
function sigSVG(seed) {
  const p = ['M5 25Q15 5 25 20Q30 10 35 15Q40 5 50 25Q55 10 60 20Q70 5 80 15Q85 25 95 10','M8 22Q18 8 28 18Q33 12 38 20Q48 5 58 22Q63 8 73 18Q78 25 88 12Q92 8 95 15','M5 20Q15 5 25 18Q30 10 40 22Q50 5 60 20Q70 10 80 18Q85 25 95 8','M10 18Q20 8 30 22Q35 12 45 20Q55 5 65 18Q75 10 85 22Q90 15 95 20','M3 22Q13 6 23 20Q28 14 33 18Q43 4 53 22Q58 8 68 20Q78 6 88 16Q93 22 97 8'];
  return `<svg viewBox="0 0 100 30" style="width:100%;height:100%"><path d="${p[seed%p.length]}" stroke="#333" stroke-width="1" fill="none"/></svg>`;
}

function buildReceiptHTML(t, type) {
  const isReturn = type === 'return';
  const sc = statusCfg[t.status];
  const now = new Date();
  const nowStr = `${String(now.getDate()).padStart(2,'0')}/${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][now.getMonth()]}/${(now.getFullYear()+543).toString().slice(-2)}`;
  let h = `<div class="thermal-receipt"><div class="receipt-cut-top"></div><div class="receipt-content">
    <div style="text-align:center"><div class="r-logo">🔧</div><div class="r-org">SURINHOS</div><div class="r-sub">REPAIR CENTER</div><div class="r-div"></div><div class="r-title">${isReturn?'ใบส่งคืนครุภัณฑ์':'ใบรับซ่อมอุปกรณ์'}</div><div class="r-div"></div></div>
    <div class="r-num-row"><div class="r-num-lbl">เลขที่</div><div class="r-num-val">${t.ticketNo}</div></div><div class="r-date">${t.createdAt}</div><div class="r-div"></div>
    <div class="r-row r-center"><span class="r-lbl">สถานะ</span><span class="r-val s-${t.status}" style="padding:.3mm 1.5mm;border-radius:1mm;font-weight:700;font-size:6.5pt">${sc.label}</span></div><div class="r-div"></div>
    <div class="r-sect">อุปกรณ์</div>
    <div class="r-row"><span class="r-lbl">ชื่อ</span><span class="r-val bold">${t.assetName}</span></div>
    <div class="r-row"><span class="r-lbl">ครุภัณฑ์</span><span class="r-val">${t.assetCode}</span></div>
    <div class="r-row"><span class="r-lbl">ประเภท</span><span class="r-val">${t.category}</span></div>
    <div class="r-row"><span class="r-lbl">สถานที่</span><span class="r-val">${t.location}</span></div><div class="r-div"></div>
    <div class="r-sect">รายละเอียดปัญหา</div><div class="r-desc">${t.problemDetails||'-'}</div><div class="r-div"></div>
    <div class="r-row"><span class="r-lbl">ผู้แจ้ง</span><span class="r-val">${t.reporterName||'-'}</span></div>`;
  if (!isReturn && t.receivedBy) {
    h += `<div class="r-row"><span class="r-lbl">ผู้รับเรื่อง</span><span class="r-val">${t.receivedBy}</span></div><div class="r-row"><span class="r-lbl">วันรับ</span><span class="r-val">${t.receivedAt}</span></div><div class="r-div"></div><div class="r-sig-sec"><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้ส่ง</div><div class="r-sig-wrap">${sigSVG(0)}</div></div><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้รับ</div><div class="r-sig-wrap">${sigSVG(1)}</div></div></div><div class="r-div"></div>`;
  }
  if (isReturn) { if(t.returnMethod) h+=`<div class="r-row"><span class="r-lbl">วิธีส่งคืน</span><span class="r-val">${t.returnMethod}</span></div>`; if(t.returnedBy) h+=`<div class="r-row"><span class="r-lbl">ผู้ส่งคืน</span><span class="r-val">${t.returnedBy}</span></div>`; if(t.returnedAt) h+=`<div class="r-row"><span class="r-lbl">วันส่งคืน</span><span class="r-val">${t.returnedAt}</span></div>`; h+=`<div class="r-div"></div>`; }
  if (t.totalCost != null) { h+=`<div class="r-sect">ค่าใช้จ่าย</div><div class="r-row"><span class="r-lbl">ค่าอะไหล่</span><span class="r-val">${t.repairCost?.toLocaleString()||'-'}</span></div><div class="r-row"><span class="r-lbl">ค่าแรง</span><span class="r-val">${t.laborCost?.toLocaleString()||'-'}</span></div><div class="r-row r-total-row"><span class="r-lbl">รวมทั้งหมด</span><span class="r-val">${t.totalCost.toLocaleString()} บาท</span></div><div class="r-div"></div>`; }
  if (isReturn && t.returnedBy) { h+=`<div class="r-sig-sec"><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้ส่งคืน</div><div class="r-sig-wrap">${sigSVG(2)}</div></div><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้รับคืน</div><div class="r-sig-wrap">${sigSVG(3)}</div></div></div><div class="r-div"></div>`; }
  if (t.cancelReason) { h+=`<div class="r-sect r-danger">เหตุผลยกเลิก</div><div class="r-desc r-danger">${t.cancelReason}</div><div class="r-div"></div>`; }
  h += `<div class="r-footer"><div class="r-foot-line">พิมพ์เมื่อ: ${nowStr}</div><div class="r-foot-line">Surinhos Asset Management</div><div class="r-foot-thanks">☆ ขอบคุณที่ใช้บริการ ☆</div></div></div><div class="receipt-cut-bottom"></div></div>`;
  return h;
}

function openReceipt(id, type) {
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modal-title').textContent = type === 'return' ? 'พรีวิวใบส่งคืน' : 'พรีวิวใบรับซ่อม';
  document.getElementById('receipt-render').innerHTML = buildReceiptHTML(t, type);
  document.getElementById('print-area').innerHTML = buildReceiptHTML(t, type);
  document.getElementById('receipt-modal').classList.remove('hidden');
}
function closeReceiptModal() { document.getElementById('receipt-modal').classList.add('hidden'); }
function doPrint() { closeReceiptModal(); setTimeout(() => window.print(), 200); }

// ===================== ACTIONS =====================

// -- Photo Upload --
let uploadedPhotos = [];
function handlePhotoUpload(e) {
  const files = Array.from(e.target.files);
 const previewArea = document.getElementById('photo-preview-area');
  const uploadArea = document.getElementById('photo-upload-area');

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      uploadedPhotos.push(ev.target.result);
      renderPhotoPreviews();
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreviews() {
  const area = document.getElementById('photo-preview-area');
  if (uploadedPhotos.length === 0) {
    area.classList.add('hidden');
    return;
  }
  area.classList.remove('hidden');
  area.innerHTML = uploadedPhotos.map((p, i) => `
    <div class="relative group">
      <div class="w-16 h-16 rounded-md border border-gray-200 overflow-hidden cursor-pointer" onclick="showLightbox('${p.substring(0,50)}...')">
        <img src="${p}" class="w-full h-full object-cover">
      </div>
      <button onclick="removePhoto(${i})" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow">×</button>
    </div>
  `).join('') + `
    <div class="w-16 h-16 rounded-md border-2 border-dashed border-gray-200 flex items-center justify-center cursor-pointer hover:border-emerald-300 hover:bg-emerald-50/30 transition" onclick="document.getElementById('photo-input').click()">
      <span class="text-gray-400 text-lg">+</span>
    </div>`;
}

function removePhoto(index) {
  uploadedPhotos.splice(index, 1);
  renderPhotoPreviews();
}

// -- Lightbox --
function showLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.remove('hidden');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
}

// -- Disposal --
let disposalTicketId = null;
function openDisposalModal(id) {
  disposalTicketId = id;
  const t = tickets.find(x => x.id === id);
  document.getElementById('disposal-ticket-info').innerHTML = `<strong>${t.ticketNo}</strong> — ${t.assetName} (${t.assetCode})`;
  // Reset fields
  document.getElementById('disposal-reason').value = '';
  document.getElementById('disposal-method').value = '';
  document.getElementById('disposal-value').value = '';
  document.getElementById('disposal-approver').value = '';
  document.getElementById('disposal-comref').value = '';
  document.getElementById('disposal-modal').classList.remove('hidden');
}

function submitDisposal() {
  const reason = document.getElementById('disposal-reason').value;
  const method = document.getElementById('disposal-method').value;
  const value = parseFloat(document.getElementById('disposal-value').value) || 0;
  const approver = document.getElementById('disposal-approver').value;
  const comref = document.getElementById('disposal-comref').value;

  if (!reason || !method) {
    showToast('⚠️ กรุณากรอกเหตุผลและวิธีจำหน่าย');
    return;
  }

  const t = tickets.find(x => x.id === disposalTicketId);
  if (t) {
    t.status = 'disposed';
    t.disposalStatus = 'pending_review';
    t.disposalReason = reason;
    t.disposalMethod = method;
    t.disposalValue = value;
    t.disposalApprovedBy = approver || null;
    t.disposalComRef = comref || null;
  }

  document.getElementById('disposal-modal').classList.add('hidden');
  showToast('🗑️ บันทึกการตีแทงจำหน่ายเรียบร้อย');
  render();
}

function setView(view) {
  state.view = view;
  state.selectedId = null;
  render();
}

function selectTicket(id) {
  state.selectedId = id;
  render();
}

function closeMobileDetail() {
  state.selectedId = null;
  document.getElementById('mobile-detail').classList.add('hidden');
  renderList();
}

function showCreateForm() { document.getElementById('create-modal').classList.remove('hidden'); }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('translate-x-[120%]'); el.classList.add('translate-x-0');
  setTimeout(() => { el.classList.remove('translate-x-0'); el.classList.add('translate-x-[120%]'); }, 2500);
}

// ===================== INIT =====================
render();

// Handle resize
window.addEventListener('resize', () => render());
</script>
</body>
</html>
