<style>
body { font-family: -apple-system, "Noto Sans Thai", sans-serif; }

/* ===== DESKTOP LAYOUT ===== */
@media (min-width: 1024px) {
  .app-shell {
    display: grid;
    grid-template-columns: 420px 1fr;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    overflow: hidden;
  }
  .app-sidebar {
    grid-column: 1;
    grid-row: 1 / 4;
    border-right: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .app-main {
    grid-column: 2;
    grid-row: 2;
    overflow-y: auto;
    background: #fafafa;
  }
  .app-header-desktop { display: flex; }
  .app-header-mobile { display: none; }
  .app-footer-mobile { display: none; }
  .mobile-back-btn { display: none; }
}
@media (max-width: 1023px) {
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
  .app-sidebar { display: flex; flex-direction: column; }
  .app-main { flex: 1; }
  .app-header-desktop { display: none; }
  .app-header-mobile { display: flex; }
  .app-footer-mobile { display: flex; }
  .mobile-back-btn { display: flex; }
}

/* Ticket row hover */
.ticket-row {
  transition: all 0.15s ease;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.ticket-row:hover {
  background: #f7fdf9;
  border-left-color: #10b981;
}
.ticket-row.active {
  background: #ecfdf5;
  border-left-color: #059669;
}

/* Status dot */
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

/* Sidebar scroll */
.sidebar-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #e5e7eb transparent;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

/* Detail section */
.detail-section {
  background: white;
  border: 1px solid #f0f0f0;
  border-radius: 10px;
  padding: 20px 24px;
}

/* Stat pill */
.stat-pill {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0; border-radius: 10px; flex: 1;
}

/* ===== THERMAL RECEIPT ===== */
.thermal-receipt {
  font-family: 'Courier New', 'Noto Sans Thai', monospace;
  width: 50mm; min-width: 50mm; max-width: 50mm;
  margin: 0 auto; background: #fff; color: #1a1a1a;
  font-size: 7pt; line-height: 1.4; padding: 0;
}
.receipt-cut-top, .receipt-cut-bottom {
  width: 50mm; height: 4mm;
  background: repeating-linear-gradient(135deg,#fff 0px,#fff 2px,#ddd 2px,#ddd 4px,#fff 4px,#fff 6px);
}
.receipt-cut-bottom { margin-top: 2mm; }
.receipt-content { padding: 2mm 3mm; }
.r-logo { font-size:16pt; line-height:1; margin-bottom:1mm; text-align:center; }
.r-org { font-size:9pt; font-weight:700; letter-spacing:3px; text-align:center; }
.r-sub { font-size:6pt; letter-spacing:2px; opacity:.7; text-align:center; }
.r-title { font-size:8pt; font-weight:700; margin:1.5mm 0; text-align:center; }
.r-div { border:none; border-top:1px dashed #999; margin:1.5mm 0; }
.r-num-row { display:flex; align-items:baseline; justify-content:center; gap:2mm; margin:1mm 0; }
.r-num-lbl { font-size:6pt; opacity:.6; }
.r-num-val { font-size:11pt; font-weight:900; font-family:'Courier New',monospace; }
.r-date { text-align:center; font-size:6.5pt; opacity:.7; }
.r-row { display:flex; justify-content:space-between; align-items:flex-start; margin:.5mm 0; gap:1mm; }
.r-lbl { font-size:6.5pt; opacity:.5; white-space:nowrap; flex-shrink:0; }
.r-val { font-size:6.5pt; font-weight:500; text-align:right; word-break:break-word; }
.r-val.bold { font-weight:700; }
.r-center { justify-content:center; }
.r-sect { font-size:6.5pt; font-weight:700; opacity:.5; letter-spacing:.5px; margin-bottom:.5mm; padding-bottom:.3mm; border-bottom:.5px solid #ccc; }
.r-desc { font-size:6.5pt; line-height:1.4; margin:.5mm 0; word-break:break-word; }
.r-danger { color:#dc3545; }
.r-sig-sec { display:flex; gap:2mm; margin:1mm 0; }
.r-sig-blk { flex:1; text-align:center; }
.r-sig-lbl { font-size:5.5pt; opacity:.5; margin-bottom:.5mm; }
.r-sig-wrap { border:.5px solid #ccc; height:8mm; display:flex; align-items:center; justify-content:center; padding:.5mm; background:#fafafa; }
.r-total-row { border-top:1px solid #333; padding-top:.5mm; margin-top:.5mm; }
.r-total-row .r-lbl { font-weight:700; opacity:1; }
.r-total-row .r-val { font-size:8pt; font-weight:900; }
.r-footer { text-align:center; margin-top:2mm; padding-top:1mm; }
.r-foot-line { font-size:5pt; opacity:.4; margin:.3mm 0; }
.r-foot-thanks { font-size:6pt; margin-top:1mm; opacity:.6; }
.s-pending { background:#fff3cd; color:#856404; }
.s-accepted { background:#d1ecf1; color:#0c5460; }
.s-in_progress { background:#e2d5f1; color:#4a1d8e; }
.s-returned { background:#d4edda; color:#155724; }
.s-closed { background:#e2e3e5; color:#383d41; }
.s-cancelled { background:#f8d7da; color:#721c24; }
.receipt-preview-wrap {
  background:#e8e8e8; padding:20px 24px; border-radius:12px;
  display:flex; justify-content:center; overflow-x:auto;
}
.receipt-preview-wrap .thermal-receipt {
  transform:scale(2.2); transform-origin:top center;
  box-shadow:2px 4px 16px rgba(0,0,0,.18); border-radius:2px;
}
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:16px;
  backdrop-filter: blur(2px);
}
.modal-content {
  background:#fff; border-radius:12px; max-width:420px; width:100%;
  max-height:90vh; overflow-y:auto;
}
@media print {
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }
  .print-area { position:fixed; top:0; left:0; width:100%; background:#fff; z-index:99999; }
  .print-area .thermal-receipt { transform:none!important; box-shadow:none!important; }
  @page { size:50mm auto; margin:0; }
}
@media (max-width:640px) {
  .receipt-preview-wrap .thermal-receipt { transform:scale(1.8); }
}
</style>
</head>

<script>
// ===== DATA =====
const tickets = [
  { id:'1', ticketNo:'RPR-260725-001', status:'pending', assetName:'เครื่องพิมพ์ HP LaserJet Pro M404', assetCode:'PRT-69-001', category:'เครื่องพิมพ์', location:'อาคารอำนวยการ, ห้อง 102', problemDetails:'กระดาษตัน แม้เปิดปิดเครื่องใหม่แล้ว ใช้งานไม่ได้เลย', reporterName:'สุภาพร รักงาน', createdAt:'28/ก.ค./69 05:03', receivedBy:null, receivedAt:null, repairCost:null, laborCost:null, totalCost:null, costStatus:null, returnMethod:null, returnedBy:null, returnedAt:null, cancelReason:null },
  { id:'2', ticketNo:'RPR-260720-001', status:'accepted', assetName:'คอมพิวเตอร์แม่ข่าย (Server)', assetCode:'COM-69-001', category:'อุปกรณ์คอมพิวเตอร์', location:'อาคารอำนวยการ, ห้องเซิร์ฟเวอร์', problemDetails:'เปิดเครื่องไม่ติด ไฟกระพริบที่ปุ่ม power', reporterName:'สมชาย ใจดี', createdAt:'20/ก.ค./68 09:15', receivedBy:'วิชัย ซ่อมดี', receivedAt:'20/ก.ค./68 10:30', repairCost:null, laborCost:null, totalCost:null, costStatus:null, returnMethod:null, returnedBy:null, returnedAt:null, cancelReason:null },
  { id:'3', ticketNo:'RPR-260718-001', status:'in_progress', assetName:'โน้ตบุ๊ค ASUS ExpertBook B9', assetCode:'COM-69-005', category:'อุปกรณ์คอมพิวเตอร์', location:'อาคารเรียนรวม, ห้อง 202', problemDetails:'จอภาพเบลอ มีจุดสว่างผิดปกติหลายจุด', reporterName:'ธนา พิมพ์ดี', createdAt:'18/ก.ค./68 08:00', receivedBy:'วิชัย ซ่อมดี', receivedAt:'18/ก.ค./68 09:00', repairCost:4500, laborCost:1500, totalCost:6000, costStatus:'approved', returnMethod:null, returnedBy:null, returnedAt:null, cancelReason:null },
  { id:'4', ticketNo:'RPR-260715-001', status:'returned', assetName:'เร้าเตอร์ TP-Link Archer AX6000', assetCode:'NET-69-002', category:'อุปกรณ์เครือข่าย', location:'อาคารอำนวยการ, ห้องไอที ชั้น 2', problemDetails:'สัญญาณ Wi-Fi ไม่เสถียร หลุดบ่อย', reporterName:'ประยุทธ์ รักเทคโนโลยี', createdAt:'15/ก.ค./68 14:00', receivedBy:'วิชัย ซ่อมดี', receivedAt:'15/ก.ค./68 14:00', repairCost:800, laborCost:500, totalCost:1300, costStatus:'approved', returnMethod:'ส่งมอบถึงห้อง', returnedBy:'วิชัย ซ่อมดี', returnedAt:'17/ก.ค./68 11:00', cancelReason:null },
  { id:'5', ticketNo:'RPR-260710-001', status:'closed', assetName:'โปรเจกเตอร์ Epson EB-L260F', assetCode:'PRJ-69-001', category:'เครื่องฉาย', location:'อาคารเรียนรวม, ห้องประชุม A', problemDetails:'ภาพเบลอ สีเพี้ยน ตัวเลือนไม่ทำงาน', reporterName:'วรรณา สอนดี', createdAt:'10/ก.ค./68 08:30', receivedBy:'วิชัย ซ่อมดี', receivedAt:'10/ก.ค./68 08:30', repairCost:12000, laborCost:3000, totalCost:15000, costStatus:'paid', returnMethod:'ส่งมอบถึงห้อง', returnedBy:'วิชัย ซ่อมดี', returnedAt:'14/ก.ค./68 16:00', cancelReason:null },
  { id:'6', ticketNo:'RPR-260712-001', status:'cancelled', assetName:'เครื่องสแกน Fujitsu ScanSnap iX1600', assetCode:'SCN-69-001', category:'เครื่องสแกน', location:'อาคารอำนวยการ, ห้อง 103', problemDetails:'กระดาษฉีกขณะสแคน แทร็คปิดไม่สนิท', reporterName:'สมหญิง รักการ์ด', createdAt:'12/ก.ค./68 10:00', receivedBy:null, receivedAt:null, repairCost:null, laborCost:null, totalCost:null, costStatus:null, returnMethod:null, returnedBy:null, returnedAt:null, cancelReason:'อะแดปเตอร์หมดสต็อก ยี่ห้อหยุดผลิตรุ่นนี้แล้ว ค่าอะไหล่เกินกว่าราคาซื้อเครื่องใหม่ (ราคาซ่อม ~15,000 บาท vs เครื่องใหม่ 12,000 บาท)' },
];

const statusConfig = {
  pending:    { label:'รอรับเรื่อง', dot:'#f59e0b', bg:'bg-amber-50',  text:'text-amber-600' },
  accepted:   { label:'รับเรื่องแล้ว', dot:'#3b82f6', bg:'bg-blue-50',   text:'text-blue-600' },
  in_progress:{ label:'กำลังซ่อม',    dot:'#8b5cf6', bg:'bg-violet-50', text:'text-violet-600' },
  returned:   { label:'ส่งคืนแล้ว',    dot:'#10b981', bg:'bg-emerald-50',text:'text-emerald-600' },
  closed:     { label:'ปิดงาน',       dot:'#6b7280', bg:'bg-gray-50',   text:'text-gray-500' },
  cancelled:  { label:'ยกเลิก',       dot:'#ef4444', bg:'bg-red-50',    text:'text-red-500' },
};

let selectedId = null;
let isDesktop = window.innerWidth >= 1024;

// ===== STATS =====
function renderStats() {
  const counts = {};
  Object.keys(statusConfig).forEach(k => counts[k] = 0);
  tickets.forEach(t => counts[t.status]++);
  const total = tickets.length;

  document.getElementById('stats-area').innerHTML = `
    <div class="flex gap-1.5">
      <div class="stat-pill bg-gray-50 rounded-lg">
        <span class="text-lg font-bold text-gray-800">${total}</span>
        <span class="text-[10px] text-gray-400">ทั้งหมด</span>
      </div>
      ${Object.entries(statusConfig).map(([k,v]) => counts[k] > 0 ? `
        <div class="stat-pill ${v.bg} rounded-lg">
          <span class="text-lg font-bold ${v.text}">${counts[k]}</span>
          <span class="text-[10px] text-gray-400">${v.label.replace('รอรับเรื่อง','รอ').replace('รับเรื่องแล้ว','รับ').replace('กำลังซ่อม','ซ่อม').replace('ส่งคืนแล้ว','ส่ง').replace('ปิดงาน','ปิด').replace('ยกเลิก','ยก')}</span>
        </div>` : '').join('')}
    </div>
  `;
}

// ===== TICKET LIST =====
function renderList() {
  const query = (document.getElementById('search-input')?.value || '').toLowerCase();
  const filtered = query ? tickets.filter(t =>
    t.ticketNo.toLowerCase().includes(query) ||
    t.assetName.toLowerCase().includes(query) ||
    t.reporterName?.toLowerCase().includes(query)
  ) : tickets;

  document.getElementById('list-area').innerHTML = filtered.length === 0
    ? '<div class="text-center py-8 text-gray-300 text-sm">ไม่พบรายการ</div>'
    : filtered.map(t => {
      const s = statusConfig[t.status];
      const isActive = t.id === selectedId;
      return `
        <div class="ticket-row ${isActive ? 'active' : ''} px-3 py-3 mb-0.5 rounded-lg" onclick="selectTicket('${t.id}')">
          <div class="flex items-center gap-3 mb-1">
            <div class="status-dot" style="background:${s.dot}"></div>
            <span class="text-[13px] font-semibold text-gray-800 font-mono">${t.ticketNo}</span>
            <span class="ml-auto text-[11px] text-gray-400">${t.createdAt.split(' ')[0]}</span>
          </div>
          <div class="pl-5">
            <p class="text-[13px] text-gray-700 truncate">${t.assetName}</p>
            <p class="text-[11px] text-gray-400 truncate mt-0.5">${t.assetCode} · ${t.location}</p>
          </div>
        </div>`;
    }).join('');
}

function filterTickets() { renderList(); }

// ===== DETAIL =====
function selectTicket(id) {
  selectedId = id;
  renderList();
  renderDetail(id);
}

function renderDetail(id) {
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  const s = statusConfig[t.status];

  const timeline = ['pending','accepted','in_progress','returned','closed'];
  const idx = t.status === 'cancelled' ? -1 : timeline.indexOf(t.status);

  // Desktop
  document.getElementById('detail-breadcrumb').innerHTML = `
    <span class="text-gray-300">รายการแจ้งซ่อม</span>
    <span class="mx-2 text-gray-300">›</span>
    <span class="text-gray-700 font-medium">${t.ticketNo}</span>`;

  let html = `
    <div class="max-w-3xl space-y-5">

      <!-- Title bar -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button onclick="selectTicket(null);selectedId=null;renderList()" class="mobile-back-btn items-center gap-1 text-sm text-gray-400 hover:text-gray-600 transition -ml-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            กลับ
          </button>
          <div>
            <h2 class="text-xl font-bold text-gray-900">${t.ticketNo}</h2>
            <p class="text-sm text-gray-400 mt-0.5">${t.createdAt}</p>
          </div>
        </div>
        <span class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full ${s.bg} ${s.text}">
          <span class="w-1.5 h-1.5 rounded-full" style="background:${s.dot}"></span>
          ${s.label}
        </span>
      </div>

      ${t.cancelReason ? `
      <!-- Cancel -->
      <div class="bg-red-50 border border-red-100 rounded-xl p-5">
        <p class="text-sm font-semibold text-red-600 mb-1.5">เหตุผลการยกเลิก</p>
        <p class="text-sm text-red-500 leading-relaxed">${t.cancelReason}</p>
      </div>` : ''}

      <!-- Info grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="detail-section">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">อุปกรณ์</h3>
          <div class="space-y-2.5 text-sm">
            <div><span class="text-gray-400 w-20 inline-block">ชื่อ</span><span class="font-medium text-gray-800">${t.assetName}</span></div>
            <div><span class="text-gray-400 w-20 inline-block">ครุภัณฑ์</span><span class="font-medium text-gray-800 font-mono">${t.assetCode}</span></div>
            <div><span class="text-gray-400 w-20 inline-block">ประเภท</span><span class="text-gray-700">${t.category}</span></div>
            <div><span class="text-gray-400 w-20 inline-block">สถานที่</span><span class="text-gray-700">${t.location}</span></div>
          </div>
        </div>
        <div class="detail-section">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">รายละเอียด</h3>
          <div class="space-y-2.5 text-sm">
            <div><span class="text-gray-400 w-20 inline-block">ปัญหา</span><span class="text-gray-800 leading-relaxed">${t.problemDetails}</span></div>
            <div><span class="text-gray-400 w-20 inline-block">ผู้แจ้ง</span><span class="text-gray-800">${t.reporterName}</span></div>
            ${t.receivedBy ? `<div><span class="text-gray-400 w-20 inline-block">ผู้รับ</span><span class="text-gray-800">${t.receivedBy}</span></div>
            <div><span class="text-gray-400 w-20 inline-block">รับเมื่อ</span><span class="text-gray-800">${t.receivedAt}</span></div>` : ''}
          </div>
        </div>
      </div>`;

  // Cost
  if (t.totalCost != null) {
    html += `
      <div class="detail-section">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">ค่าใช้จ่าย</h3>
        <div class="flex items-center justify-between">
          <div class="flex gap-8 text-sm">
            <div><span class="text-gray-400">ค่าอะไหล่</span><br><span class="font-medium text-gray-800">${t.repairCost.toLocaleString()} ฿</span></div>
            <div><span class="text-gray-400">ค่าแรง</span><br><span class="font-medium text-gray-800">${t.laborCost.toLocaleString()} ฿</span></div>
          </div>
          <div class="text-right">
            <span class="text-gray-400 text-sm block">รวม</span>
            <span class="text-2xl font-bold text-emerald-600">${t.totalCost.toLocaleString()}</span>
            <span class="text-sm text-gray-400"> ฿</span>
          </div>
        </div>
      </div>`;
  }

  // Signatures
  if (t.receivedBy) {
    html += `
      <div class="detail-section">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">ลายเซ็น — รับเรื่อง</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="border border-gray-100 rounded-lg p-3 text-center bg-gray-50/50">
            <p class="text-[10px] text-gray-400 mb-2">ผู้ส่ง</p>
            <svg viewBox="0 0 100 30" class="w-full h-10"><path d="M5 25Q15 5 25 20Q30 10 35 15Q40 5 50 25Q55 10 60 20Q70 5 80 15Q85 25 95 10" stroke="#aaa" stroke-width="1.5" fill="none"/></svg>
          </div>
          <div class="border border-gray-100 rounded-lg p-3 text-center bg-gray-50/50">
            <p class="text-[10px] text-gray-400 mb-2">ผู้รับ</p>
            <svg viewBox="0 0 100 30" class="w-full h-10"><path d="M8 22Q18 8 28 18Q33 12 38 20Q48 5 58 22Q63 8 73 18Q78 25 88 12Q92 8 95 15" stroke="#aaa" stroke-width="1.5" fill="none"/></svg>
          </div>
        </div>
      </div>`;
  }

  if (t.returnedBy) {
    html += `
      <div class="detail-section">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">ข้อมูลส่งคืน</h3>
        <div class="flex gap-8 text-sm mb-4">
          <div><span class="text-gray-400">วิธีส่งคืน</span><br><span class="text-gray-800">${t.returnMethod}</span></div>
          <div><span class="text-gray-400">ผู้ส่งคืน</span><br><span class="text-gray-800">${t.returnedBy}</span></div>
          <div><span class="text-gray-400">วันส่งคืน</span><br><span class="text-gray-800">${t.returnedAt}</span></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="border border-gray-100 rounded-lg p-3 text-center bg-gray-50/50">
            <p class="text-[10px] text-gray-400 mb-2">ผู้ส่งคืน</p>
            <svg viewBox="0 0 100 30" class="w-full h-10"><path d="M5 20Q15 5 25 18Q30 10 40 22Q50 5 60 20Q70 10 80 18Q85 25 95 8" stroke="#aaa" stroke-width="1.5" fill="none"/></svg>
          </div>
          <div class="border border-gray-100 rounded-lg p-3 text-center bg-gray-50/50">
            <p class="text-[10px] text-gray-400 mb-2">ผู้รับคืน</p>
            <svg viewBox="0 0 100 30" class="w-full h-10"><path d="M10 18Q20 8 30 22Q35 12 45 20Q55 5 65 18Q75 10 85 22Q90 15 95 20" stroke="#aaa" stroke-width="1.5" fill="none"/></svg>
          </div>
        </div>
      </div>`;
  }

  // Timeline
  if (t.status !== 'cancelled') {
    html += `
      <div class="detail-section">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">ความคืบหน้า</h3>
        <div class="flex items-center gap-0">
          ${timeline.map((st, i) => {
            const sc = statusConfig[st];
            const done = i <= idx;
            const current = i === idx;
            const isLast = i === timeline.length - 1;
            return `
              <div class="flex items-center ${isLast ? '' : 'flex-1'}">
                <div class="flex flex-col items-center">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center transition-all ${current ? 'bg-emerald-600 text-white ring-4 ring-emerald-100' : done ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-300'}">
                    ${done ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : '<div class="w-1.5 h-1.5 rounded-full bg-gray-300"></div>'}
                  </div>
                  <span class="text-[10px] mt-1.5 ${current ? 'font-semibold text-emerald-700' : done ? 'text-gray-500' : 'text-gray-300'}">${sc.label}</span>
                </div>
                ${isLast ? '' : `<div class="h-0.5 flex-1 mx-1 ${i < idx ? 'bg-emerald-400' : 'bg-gray-100'}"></div>`}
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  // Actions
  let actions = '';
  if (t.status === 'pending') actions = `<button onclick="showToast('✅ รับเรื่องเรียบร้อย')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-5 py-2.5 rounded-lg transition shadow-sm">รับเรื่อง</button>`;
  if (t.status === 'accepted') actions = `<button onclick="showToast('🔧 เริ่มซ่อมแล้ว')" class="bg-violet-600 hover:bg-violet-700 text-white text-sm px-5 py-2.5 rounded-lg transition shadow-sm">เริ่มซ่อม</button><button onclick="openReceipt('${t.id}','repair')" class="border border-gray-200 text-sm px-5 py-2.5 rounded-lg hover:bg-gray-50 transition">🖨️ ปริ้นรับซ่อม</button>`;
  if (t.status === 'in_progress') actions = `<button onclick="showToast('💰 เสนอราคาเรียบร้อย')" class="bg-amber-500 hover:bg-amber-600 text-white text-sm px-5 py-2.5 rounded-lg transition shadow-sm">เสนอราคา</button><button onclick="showToast('📦 ส่งคืนเรียบร้อย')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-5 py-2.5 rounded-lg transition shadow-sm">ส่งคืน</button>`;
  if (t.status === 'returned') actions = `<button onclick="showToast('✅ ปิดงานเรียบร้อย')" class="bg-gray-800 hover:bg-gray-900 text-white text-sm px-5 py-2.5 rounded-lg transition shadow-sm">ปิดงาน</button><button onclick="openReceipt('${t.id}','return')" class="border border-gray-200 text-sm px-5 py-2.5 rounded-lg hover:bg-gray-50 transition">🖨️ ปริ้นส่งคืน</button>`;
  if (t.status === 'closed') actions = `<button onclick="openReceipt('${t.id}','repair')" class="border border-gray-200 text-sm px-5 py-2.5 rounded-lg hover:bg-gray-50 transition">🖨️ ปริ้นรับซ่อม</button><button onclick="openReceipt('${t.id}','return')" class="border border-gray-200 text-sm px-5 py-2.5 rounded-lg hover:bg-gray-50 transition">🖨️ ปริ้นส่งคืน</button>`;

  if (actions) {
    html += `
      <div class="detail-section">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">การดำเนินการ</h3>
        <div class="flex flex-wrap gap-2.5">${actions}</div>
      </div>`;
  }

  html += '</div>';
  document.getElementById('detail-content').innerHTML = html;
}

// ===== RECEIPT =====
function sigSVG(seed) {
  const p = ['M5 25Q15 5 25 20Q30 10 35 15Q40 5 50 25Q55 10 60 20Q70 5 80 15Q85 25 95 10','M8 22Q18 8 28 18Q33 12 38 20Q48 5 58 22Q63 8 73 18Q78 25 88 12Q92 8 95 15','M5 20Q15 5 25 18Q30 10 40 22Q50 5 60 20Q70 10 80 18Q85 25 95 8','M10 18Q20 8 30 22Q35 12 45 20Q55 5 65 18Q75 10 85 22Q90 15 95 20','M3 22Q13 6 23 20Q28 14 33 18Q43 4 53 22Q58 8 68 20Q78 6 88 16Q93 22 97 8'];
  return `<svg viewBox="0 0 100 30" style="width:100%;height:100%"><path d="${p[seed%p.length]}" stroke="#333" stroke-width="1" fill="none"/></svg>`;
}

function buildReceiptHTML(t, type) {
  const isReturn = type === 'return';
  const sc = statusConfig[t.status];
  const now = new Date();
  const nowStr = `${String(now.getDate()).padStart(2,'0')}/${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][now.getMonth()]}/${(now.getFullYear()+543).toString().slice(-2)}`;
  let h = `<div class="thermal-receipt"><div class="receipt-cut-top"></div><div class="receipt-content">
    <div style="text-align:center"><div class="r-logo">🔧</div><div class="r-org">SURINHOS</div><div class="r-sub">REPAIR CENTER</div><div class="r-div"></div><div class="r-title">${isReturn?'ใบส่งคืนครุภัณฑ์':'ใบรับซ่อมอุปกรณ์'}</div><div class="r-div"></div></div>
    <div class="r-num-row"><div class="r-num-lbl">เลขที่</div><div class="r-num-val">${t.ticketNo}</div></div><div class="r-date">${t.createdAt}</div><div class="r-div"></div>
    <div class="r-row r-center"><span class="r-lbl">สถานะ</span><span class="r-val s-${t.status}" style="padding:.3mm 1.5mm;border-radius:1mm;font-weight:700;font-size:6.5pt">${sc.label}</span></div><div class="r-div"></div>
    <div class="r-sect">อุปกรณ์</div>
    <div class="r-row"><span class="r-lbl">ชื่อ</span><span class="r-val bold">${t.assetName}</span></div>
    <div class="r-row"><span class="r-lbl">ครุภัณฑ์</span><span class="r-val">${t.assetCode}</span></div>
    <div class="r-row"><span class="r-lbl">ประเภท</span><span class="r-val">${t.category}</span></div>
    <div class="r-row"><span class="r-lbl">สถานที่</span><span class="r-val">${t.location}</span></div><div class="r-div"></div>
    <div class="r-sect">รายละเอียดปัญหา</div><div class="r-desc">${t.problemDetails||'-'}</div><div class="r-div"></div>
    <div class="r-row"><span class="r-lbl">ผู้แจ้ง</span><span class="r-val">${t.reporterName||'-'}</span></div>`;
  if (!isReturn && t.receivedBy) {
    h += `<div class="r-row"><span class="r-lbl">ผู้รับเรื่อง</span><span class="r-val">${t.receivedBy}</span></div><div class="r-row"><span class="r-lbl">วันรับ</span><span class="r-val">${t.receivedAt}</span></div><div class="r-div"></div><div class="r-sig-sec"><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้ส่ง</div><div class="r-sig-wrap">${sigSVG(0)}</div></div><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้รับ</div><div class="r-sig-wrap">${sigSVG(1)}</div></div></div><div class="r-div"></div>`;
  }
  if (isReturn) { if(t.returnMethod) h+=`<div class="r-row"><span class="r-lbl">วิธีส่งคืน</span><span class="r-val">${t.returnMethod}</span></div>`; if(t.returnedBy) h+=`<div class="r-row"><span class="r-lbl">ผู้ส่งคืน</span><span class="r-val">${t.returnedBy}</span></div>`; if(t.returnedAt) h+=`<div class="r-row"><span class="r-lbl">วันส่งคืน</span><span class="r-val">${t.returnedAt}</span></div>`; h+=`<div class="r-div"></div>`; }
  if (t.totalCost != null) { h+=`<div class="r-sect">ค่าใช้จ่าย</div><div class="r-row"><span class="r-lbl">ค่าอะไหล่</span><span class="r-val">${t.repairCost?.toLocaleString()||'-'}</span></div><div class="r-row"><span class="r-lbl">ค่าแรง</span><span class="r-val">${t.laborCost?.toLocaleString()||'-'}</span></div><div class="r-row r-total-row"><span class="r-lbl">รวมทั้งหมด</span><span class="r-val">${t.totalCost.toLocaleString()} บาท</span></div><div class="r-div"></div>`; }
  if (isReturn && t.returnedBy) { h+=`<div class="r-sig-sec"><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้ส่งคืน</div><div class="r-sig-wrap">${sigSVG(2)}</div></div><div class="r-sig-blk"><div class="r-sig-lbl">ลายเซ็น ผู้รับคืน</div><div class="r-sig-wrap">${sigSVG(3)}</div></div></div><div class="r-div"></div>`; }
  if (t.cancelReason) { h+=`<div class="r-sect r-danger">เหตุผลยกเลิก</div><div class="r-desc r-danger">${t.cancelReason}</div><div class="r-div"></div>`; }
  h += `<div class="r-footer"><div class="r-foot-line">พิมพ์เมื่อ: ${nowStr}</div><div class="r-foot-line">Surinhos Asset Management</div><div class="r-foot-thanks">☆ ขอบคุณที่ใช้บริการ ☆</div></div></div><div class="receipt-cut-bottom"></div></div>`;
  return h;
}

function openReceipt(id, type) {
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modal-title').textContent = type === 'return' ? 'พรีวิวใบส่งคืน' : 'พรีวิวใบรับซ่อม';
  document.getElementById('receipt-render').innerHTML = buildReceiptHTML(t, type);
  document.getElementById('print-area').innerHTML = buildReceiptHTML(t, type);
  document.getElementById('receipt-modal').classList.remove('hidden');
}
function closeReceiptModal() { document.getElementById('receipt-modal').classList.add('hidden'); }
function doPrint() { closeReceiptModal(); setTimeout(() => window.print(), 200); }
function showCreateForm() { document.getElementById('create-modal').classList.remove('hidden'); }
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('translate-x-[120%]'); el.classList.add('translate-x-0');
  setTimeout(() => { el.classList.remove('translate-x-0'); el.classList.add('translate-x-[120%]'); }, 2500);
}

// Init
renderStats();
renderList();
</script>
